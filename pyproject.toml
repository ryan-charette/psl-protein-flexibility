[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "psl-protein-flexibility"
version = "0.1.0"
description = "Self-contained persistent sheaf Laplacian descriptors for protein flexibility analysis."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Ryan Charette" },
]
keywords = [
  "bioinformatics",
  "protein flexibility",
  "persistent sheaf laplacian",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.scripts]
psl-flexibility = "psl_flexibility.cli:main"

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.7",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "shap>=0.44",
]
test = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/ryan-charette/psl-protein-flexibility"
Repository = "https://github.com/ryan-charette/psl-protein-flexibility"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
]
test = [
  "pytest>=8.0",
]
lint = [
  "mypy>=1.10",
  "pre-commit>=3.7",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
log_level = "INFO"
filterwarnings = ["error"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

[tool.mypy]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
