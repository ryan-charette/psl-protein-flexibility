name: Question
description: Ask for help with installation, usage, or documented workflows.
title: "[Question]: "
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include commands, input-data notes, and links to relevant documentation.
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, package version or commit"
